<div class="assist-launch"><button type="button" class="quiet" id="assist-open" aria-controls="assist-panel" aria-expanded="false">Word help</button><span class="muted">Select a word or sentence while you read.</span></div>
<section id="assist-panel" class="assist-panel" role="dialog" aria-modal="false" aria-labelledby="assist-title" lang="en" hidden>
  <header class="assist-heading"><h2 id="assist-title" tabindex="-1">Word help</h2><button type="button" id="assist-close" aria-label="Close word help">&times;</button></header>
  <p id="assist-selection" class="assist-selection" aria-label="Selected text"></p>
  <p id="assist-availability" class="muted" role="status"></p>
  <p id="assist-login" hidden><a href="{% url 'login' %}?next={{ request.path|urlencode }}">Log in for word help</a>.</p>
  <div class="assist-toolbar" role="toolbar" aria-label="Text actions">
    <button type="button" id="assist-explain">Explain</button>
    <span id="assist-actions" hidden><button type="button" id="assist-listen">Listen</button><button type="button" id="assist-stop" hidden>Stop</button><button type="button" id="assist-practice">Practice</button></span>
    <button type="button" id="assist-copy" disabled>Copy</button>
  </div>
  <p id="assist-status" role="status" aria-live="polite" aria-atomic="true"></p>
  <div id="assist-result" hidden>
    <p id="assist-meaning" class="assist-meaning"></p><p id="assist-ipa" class="assist-ipa"></p>
    <details id="assist-details"><summary>Pronunciation &amp; details</summary>
      <dl id="assist-definitions"></dl><ul id="assist-examples"></ul>
      <label for="assist-speed">Voice speed<select id="assist-speed"><option value="1">Normal</option><option value="0.75">Slower (0.75&times;)</option></select></label>
      <p class="muted">Gemini can make mistakes. Sound comparisons are approximate and depend on your accent.</p>
    </details>
  </div>
  {% include 'assistance/practice.html' %}
  <details id="assist-picker" hidden><summary>Choose a passage</summary><div class="assist-picker"><label for="assist-paragraph">Paragraph</label><select id="assist-paragraph"></select><label for="assist-passage">Word or sentence</label><select id="assist-passage"></select></div></details>
</section>
<noscript><p>Word help needs JavaScript. Reading and native audio controls remain available.</p></noscript>
